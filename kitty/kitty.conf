# Transparent background with compositor-provided blur (KDE Plasma / Wayland).
background_opacity 0.80
background_blur 1
dynamic_background_opacity yes

# Padding
window_padding_width 10

# Use Zsh even when the desktop session still exports SHELL=/usr/bin/bash.
shell /usr/bin/zsh

# Start with a larger window instead of restoring the previous size.
remember_window_size no
initial_window_width 140c
initial_window_height 40c

# Font Family & Weights
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Ligatures & OpenType Features
disable_ligatures cursor
font_features JetBrainsMonoNF-Regular +zero +cv06 +cv14

# Spacing & Sharpness
adjust_line_height  110%
adjust_column_width 0
