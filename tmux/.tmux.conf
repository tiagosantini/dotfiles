# Keep Kitty's truecolor support inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Allow applications such as image.nvim to pass terminal graphics through tmux.
set -gq allow-passthrough on

# Practical defaults.
set -s escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g mode-keys vi

# Start windows and panes at 1, and close gaps when windows are removed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split panes with | and -, keeping the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload this configuration with the prefix followed by r.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
